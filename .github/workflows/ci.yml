name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile Code
        run: |
          cd demo
          chmod +x gradlew
          ./gradlew assemble -x test

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: trimminflow
          POSTGRES_USER: trimminflow_user
          POSTGRES_PASSWORD: mx269518
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Execute Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trimminflow
          SPRING_DATASOURCE_USERNAME: trimminflow_user
          SPRING_DATASOURCE_PASSWORD: mx269518
        run: |
          cd demo
          chmod +x gradlew
          ./gradlew test

  analyze:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd demo
          chmod +x gradlew
          ./gradlew sonar

  docker-push:
    name: 🐳 Docker Push
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./demo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trimminflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trimminflow-backend:${{ github.sha }}
