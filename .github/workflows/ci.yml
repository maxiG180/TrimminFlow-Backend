name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-deploy:
    name: Build, Analyze & Deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: trimminflow
          POSTGRES_USER: trimminflow_user
          POSTGRES_PASSWORD: mx269518
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trimminflow
          SPRING_DATASOURCE_USERNAME: trimminflow_user
          SPRING_DATASOURCE_PASSWORD: mx269518
        run: |
          cd demo
          chmod +x gradlew
          ./gradlew build jacocoTestReport

      - name: SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trimminflow
          SPRING_DATASOURCE_USERNAME: trimminflow_user
          SPRING_DATASOURCE_PASSWORD: mx269518
        run: |
          cd demo
          ./gradlew sonar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./demo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trimminflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trimminflow-backend:${{ github.sha }}
