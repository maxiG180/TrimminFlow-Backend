name: CI
# WHEN to run this workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      run: cd demo && chmod +x gradlew && ./gradlew assemble

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    # Start a PostgreSQL database for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: trimminflow
          POSTGRES_USER: trimminflow_user
          POSTGRES_PASSWORD: mx269518
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Run Tests and Generate Report
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trimminflow
        SPRING_DATASOURCE_USERNAME: trimminflow_user
        SPRING_DATASOURCE_PASSWORD: mx269518
      run: cd demo && chmod +x gradlew && ./gradlew test jacocoTestReport
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: demo/build/reports/jacoco/test/jacocoTestReport.xml

  sonar:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: jacoco-report
        path: demo/build/reports/jacoco/test/
    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: cd demo && chmod +x gradlew && ./gradlew sonar
