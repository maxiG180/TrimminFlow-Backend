name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: trimminflow
          POSTGRES_USER: trimminflow_user
          POSTGRES_PASSWORD: mx269518
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build, Test and Analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trimminflow
        SPRING_DATASOURCE_USERNAME: trimminflow_user
        SPRING_DATASOURCE_PASSWORD: mx269518
      run: |
        cd demo
        chmod +x gradlew
        ./gradlew build jacocoTestReport sonar

    - name: Build Docker Image
      run: |
        cd demo
        docker build -t trimminflow-backend .
