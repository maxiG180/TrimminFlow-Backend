version: '3.9'
services:
  postgres:
    image: postgres
    container_name: trimminflow-db
    restart: always
    environment:
      POSTGRES_DB: trimminflow
      POSTGRES_USER: trimminflow_user
      POSTGRES_PASSWORD: mx269518
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimminflow_user"]
      interval: 10s
      retries: 5

  backend:
    image: demo-backend
    container_name: trimminflow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trimminflow
      SPRING_DATASOURCE_USERNAME: trimminflow_user
      SPRING_DATASOURCE_PASSWORD: mx269518
      SPRING_JPA_HIBERNATE_DDL_AUTO: update   # auto-sync DB schema
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
