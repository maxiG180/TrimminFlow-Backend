spring.datasource.url=jdbc:postgresql://localhost:5432/trimminflow
spring.datasource.username=trimminflow_user
spring.datasource.password=mx269518
# Development: Hibernate automatically updates DB schema when entities change
# This is ideal for rapid development - schema updates automatically with code changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=TrimminFlowSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong
jwt.expiration=86400000

# Stripe Configuration
stripe.api.key=${STRIPE_SECRET_KEY:sk_test_stripe_key_here}

# Resend Configuration
resend.api.key=${RESEND_API_KEY:your_resend_api_key_here}

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:5173


