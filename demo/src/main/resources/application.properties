# Development: Hibernate automatically updates DB schema when entities change
# This is ideal for rapid development - schema updates automatically with code changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

